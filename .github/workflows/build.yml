name: Build

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: Upload individual jars
        uses: actions/upload-artifact@v4
        with:
          name: Individual_Jars
          path: |
            fabric/build/libs/
            neoforge/build/libs/
            forge/build/libs/

      - name: Merge jars
        run: ./gradlew mergeJars

      - name: Upload merged jar
        uses: actions/upload-artifact@v4
        with:
          name: Merged_Jar
          path: build/forgix/